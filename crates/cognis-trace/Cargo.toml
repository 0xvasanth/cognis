[package]
name = "cognis-trace"
version = "0.2.1"
edition.workspace = true
license.workspace = true
description = "Pluggable observability for Cognis: bridges CallbackHandler events to Langfuse, LangSmith, and OpenTelemetry."

[dependencies]
cognis-core = { path = "../cognis-core", version = "0.1.0" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
dashmap.workspace = true
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }
wiremock = "0.6"

[features]
default = ["stdout"]
stdout = []
langfuse = ["dep:reqwest", "dep:secrecy", "dep:base64"]
all = ["langfuse"]
integration_tests = []
