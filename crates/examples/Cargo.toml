[package]
name = "cognis-examples"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "V2 examples for the Cognis workspace"

[dependencies]
cognis-core = { path = "../cognis-core" }
cognis = { path = "../cognis", features = ["openai", "ollama"] }
cognis-graph = { path = "../cognisgraph" }
cognis-llm = { path = "../cognis-llm", features = ["ollama", "openai"] }
cognis-rag = { path = "../cognis-rag", features = ["ollama", "openai"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true
futures.workspace = true

[[example]]
name = "01_hello_runnable"
path = "../../examples/v2/01_hello_runnable.rs"

