[package]
name = "rustchain-examples"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Example programs for the RustChain workspace"

[dependencies]
rustchain-core.workspace = true
rustchain = { workspace = true, features = ["all-providers"] }
langgraph.workspace = true
deepagents.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
tempfile = "3"
uuid.workspace = true

