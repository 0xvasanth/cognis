[package]
name = "cognis-examples"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Runnable examples for the Cognis workspace, organized by category (chains, agents, memory, models, tools, retrieval, graphs, observability, resilience)."

[dependencies]
cognis-core.workspace = true
cognis = { workspace = true, features = ["openai", "ollama"] }
cognis-graph.workspace = true
cognis-llm = { workspace = true, features = ["ollama", "openai"] }
cognis-rag = { workspace = true, features = ["ollama", "openai"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true
futures.workspace = true

[[example]]
name = "01_hello_runnable"
path = "../../examples/v2/01_hello_runnable.rs"

[[example]]
