[package]
name = "cognis-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Stateful graph engine for Cognis: typed Graph<S>, Pregel-style superstep executor, per-field reducers, interrupts, time-travel via checkpointers (in-memory, SQLite, Postgres), and streaming."
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis-core.workspace = true
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }
ciborium = { version = "0.2", optional = true }

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/uuid"]
serializer-cbor = ["dep:ciborium"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
