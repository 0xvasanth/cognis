[package]
name = "cognis-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LLM client and provider abstractions for Cognis: Client, LLMProvider trait, chat options, tool definitions, and streaming. Provider implementations (OpenAI, Anthropic, Google, Ollama, Azure) are feature-gated."
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis-core.workspace = true
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio-stream.workspace = true
schemars.workspace = true
tracing.workspace = true
uuid.workspace = true
regex = "1"
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[features]
default = ["openai", "ollama"]
openai = ["dep:reqwest", "dep:secrecy"]
ollama = ["dep:reqwest"]
anthropic = ["dep:reqwest", "dep:secrecy"]
google = ["dep:reqwest", "dep:secrecy"]
azure = ["dep:reqwest", "dep:secrecy"]
all-providers = ["openai", "ollama", "anthropic", "google", "azure"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
