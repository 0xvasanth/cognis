[package]
name = "cognis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cognis umbrella crate: agent builder, multi-agent orchestration, memory, middleware (rate limit, retry, PII, prompt caching), built-in tools, and re-exports of cognis-core, cognis-graph, cognis-llm, and cognis-rag."
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis-core.workspace = true
cognis-graph.workspace = true
cognis-llm.workspace = true
cognis-rag.workspace = true
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
schemars.workspace = true
uuid.workspace = true
regex-lite = "0.1"
reqwest = { workspace = true, optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }

[features]
default = ["openai", "ollama"]

# LLM providers — re-exported from cognis-llm (and cognis-rag for the
# embedding-bearing ones).
openai = ["cognis-rag/openai", "cognis-llm/openai"]
ollama = ["cognis-rag/ollama", "cognis-llm/ollama"]
anthropic = ["cognis-llm/anthropic"]
google = ["cognis-rag/google", "cognis-llm/google"]
azure = ["cognis-llm/azure"]
voyage = ["cognis-rag/voyage"]
all-providers = [
    "openai",
    "ollama",
    "anthropic",
    "google",
    "azure",
    "voyage",
]

tools-http = ["dep:reqwest"]
cache-sqlite = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
