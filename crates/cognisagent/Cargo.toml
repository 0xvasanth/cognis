[package]
name = "cognisagent"
version = "0.2.1"
edition.workspace = true
license.workspace = true
description = "Batteries-included agent framework built on cognis and cognisgraph"
repository = "https://github.com/0xvasanth/cognis"
readme = "README.md"

[dependencies]
cognis-core.workspace = true
cognis = { workspace = true, features = ["anthropic"] }
cognisgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
glob = "0.3"
regex = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
