[package]
name = "rustchain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LLM application framework built on rustchain-core"

[dependencies]
rustchain-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures.workspace = true
regex = "1"
csv = "1"
glob = "0.3"
pdf-extract = { version = "0.7", optional = true }

[dependencies.sqlx]
workspace = true
optional = true

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.secrecy]
workspace = true
optional = true

[features]
default = []
pdf = ["dep:pdf-extract"]
sqlite = ["dep:sqlx"]
openai = ["dep:reqwest", "dep:secrecy"]
anthropic = ["dep:reqwest", "dep:secrecy"]
google = ["dep:reqwest", "dep:secrecy"]
ollama = ["dep:reqwest", "dep:secrecy"]
azure = ["dep:reqwest", "dep:secrecy"]
qdrant = []
all-providers = ["openai", "anthropic", "google", "ollama", "azure"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
