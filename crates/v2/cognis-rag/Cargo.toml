[package]
name = "cognis2-rag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "v2-beta embeddings + vector store + (slice 3) RAG primitives"
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis2-core = { path = "../cognis-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
csv = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
pdf-extract = { version = "0.7", optional = true }

[features]
default = ["openai", "ollama"]
openai = ["dep:reqwest", "dep:secrecy"]
google = ["dep:reqwest", "dep:secrecy"]
ollama = ["dep:reqwest"]
csv-loader = ["dep:csv"]
html-loader = []
yaml-loader = ["dep:serde_yaml"]
toml-loader = ["dep:toml"]
web-loader = ["dep:reqwest"]
pdf-loader = ["dep:pdf-extract"]
all-loaders = ["csv-loader", "html-loader", "yaml-loader", "toml-loader", "web-loader", "pdf-loader"]
# Vector store backends (HTTP). Each pulls in reqwest + secrecy.
vectorstore-chroma = ["dep:reqwest", "dep:secrecy"]
vectorstore-qdrant = ["dep:reqwest", "dep:secrecy"]
vectorstore-pinecone = ["dep:reqwest", "dep:secrecy"]
vectorstore-weaviate = ["dep:reqwest", "dep:secrecy"]
all-vectorstores = [
    "vectorstore-chroma",
    "vectorstore-qdrant",
    "vectorstore-pinecone",
    "vectorstore-weaviate",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
