[package]
name = "cognis2-rag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "v2-beta embeddings + vector store + (slice 3) RAG primitives"
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis2-core = { path = "../cognis-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[features]
default = ["openai", "ollama"]
openai = ["dep:reqwest", "dep:secrecy"]
ollama = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
