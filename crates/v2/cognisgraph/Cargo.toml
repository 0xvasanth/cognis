[package]
name = "cognis2-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "v2-beta graph engine: typed Graph<S>, Pregel superstep executor, channels, reducers, checkpointers"
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis2-core = { path = "../cognis-core", version = "0.1.0" }
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }
ciborium = { version = "0.2", optional = true }

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/uuid"]
serializer-cbor = ["dep:ciborium"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
