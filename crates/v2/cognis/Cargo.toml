[package]
name = "cognis2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "v2-beta umbrella + thin agent layer"
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis2-core = { path = "../cognis-core", version = "0.1.0" }
cognis2-graph = { path = "../cognisgraph", version = "0.1.0" }
cognis2-llm = { path = "../cognis-llm", version = "0.1.0" }
cognis2-rag = { path = "../cognis-rag", version = "0.1.0" }
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
schemars.workspace = true
uuid.workspace = true
regex-lite = "0.1"
reqwest = { workspace = true, optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }

[features]
default = ["openai", "ollama"]
openai = ["cognis2-rag/openai", "cognis2-llm/openai"]
ollama = ["cognis2-rag/ollama", "cognis2-llm/ollama"]
tools-http = ["dep:reqwest"]
cache-sqlite = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
