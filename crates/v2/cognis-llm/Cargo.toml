[package]
name = "cognis2-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "v2-beta LLM client: providers, Client, 5-tier Tool ergonomics"
repository = "https://github.com/0xvasanth/cognis"

[dependencies]
cognis2-core = { path = "../cognis-core", version = "0.1.0" }
cognis-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio-stream.workspace = true
schemars.workspace = true
tracing.workspace = true
uuid.workspace = true
regex = "1"
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[features]
default = ["openai", "ollama"]
openai = ["dep:reqwest", "dep:secrecy"]
ollama = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
