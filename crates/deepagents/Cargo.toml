[package]
name = "deepagents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Batteries-included agent framework built on rustchain and langgraph"

[dependencies]
rustchain-core.workspace = true
rustchain = { workspace = true, features = ["anthropic"] }
langgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
glob = "0.3"
regex = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
