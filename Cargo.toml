[workspace]
resolver = "2"
members = [
    "crates/cognis-core",
    "crates/cognis",
    "crates/cognisgraph",
    "crates/cognis-macros",
    "crates/cognis-llm",
    "crates/cognis-rag",
    "crates/cognis-trace",
    "crates/examples",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Vasanth <itsparser@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures = "0.3"
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "json"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
schemars = "0.8"


dashmap = "6"
cognis = { path = "crates/cognis", version = "0.2.1" }
cognis-core = { path = "crates/cognis-core", version = "0.2.1" }
cognis-graph = { path = "crates/cognisgraph", version = "0.2.1" }
cognis-llm = { path = "crates/cognis-llm", version = "0.2.1" }
cognis-rag = { path = "crates/cognis-rag", version = "0.2.1" }
cognis-macros = { path = "crates/cognis-macros", version = "0.2.1" }
cognis-trace = { path = "crates/cognis-trace", version = "0.2.1" }
