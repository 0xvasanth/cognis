[workspace]
resolver = "2"
members = [
    "crates/rustchain-core",
    "crates/rustchain",
    "crates/langgraph",
    "crates/deepagents",
]

[package]
name = "rustchain-examples"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rustchain-core = { path = "crates/rustchain-core" }
rustchain = { path = "crates/rustchain" }
langgraph = { path = "crates/langgraph" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tempfile = "3"

[[example]]
name = "simple_chain"
path = "examples/simple_chain.rs"

[[example]]
name = "tool_agent"
path = "examples/tool_agent.rs"

[[example]]
name = "rag_pipeline"
path = "examples/rag_pipeline.rs"

[[example]]
name = "langgraph_agent"
path = "examples/langgraph_agent.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures = "0.3"
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }


rustchain = { path = "crates/rustchain" }
rustchain-core = { path = "crates/rustchain-core" }
langgraph = { path = "crates/langgraph" }
deepagents = { path = "crates/deepagents" }
