[workspace]
resolver = "2"
members = [
    "crates/rustchain-core",
    "crates/rustchain",
    "crates/langgraph",
    "crates/deepagents",
    "crates/examples",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures = "0.3"
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "json"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }


rustchain = { path = "crates/rustchain" }
rustchain-core = { path = "crates/rustchain-core" }
langgraph = { path = "crates/langgraph" }
deepagents = { path = "crates/deepagents" }
